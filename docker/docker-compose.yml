# 应用容器编排：MySQL / S3 保持外部依赖。
#   docker compose -f docker/docker-compose.yml up -d --build   # 构建并启动
#   docker compose -f docker/docker-compose.yml logs -f web     # 看日志
# 时区 / 端口 / 并发的默认值内置在 Dockerfile（TZ、PORT、WEB_CONCURRENCY、WEB_THREADS），
# 需要覆盖时写进 .env 即可（env_file 会注入容器并覆盖镜像默认值）。
services:
  web:
    build:
      context: ..            # 构建上下文 = 仓库根（镜像要打包 app/ templates/ static/）
      dockerfile: docker/Dockerfile
    image: zcsystem:latest
    env_file: ../.env
    ports:
      - "5000:5000"
    restart: unless-stopped

  # 需要自带 MySQL 时取消注释，并加 --env-file .env（插值读取 .env）：
  #   docker compose --env-file .env -f docker/docker-compose.yml up -d
