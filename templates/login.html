<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>系统登录</title>
    <link rel="icon" type="image/svg+xml" href="/static/favicon.svg">
    <link rel="stylesheet" href="/static/css/login.css?v=3">
</head>
<body>
    <div class="login-wrapper">
        <!-- 左侧品牌展示区 -->
        <div class="login-brand">
            <div class="brand-content">
                <div class="brand-icon">
                    <!-- 品牌标记：资产标签（与侧边栏 logo / favicon 同源） -->
                    <svg viewBox="0 0 24 24">
                        <path d="M12.586 2.586A2 2 0 0 0 11.172 2H4a2 2 0 0 0-2 2v7.172a2 2 0 0 0 .586 1.414l8.704 8.704a2.426 2.426 0 0 0 3.42 0l6.58-6.58a2.426 2.426 0 0 0 0-3.42z"></path>
                        <circle cx="7.5" cy="7.5" r="1"></circle>
                    </svg>
                </div>
                <h2 class="brand-title">资产管理系统</h2>
                <p class="brand-desc">高效管理企业资产，实时掌控设备动态</p>
                <div class="brand-features">
                    <div class="brand-feature-item">
                        <span class="brand-feature-dot"></span>
                        资产信息统一管理
                    </div>
                    <div class="brand-feature-item">
                        <span class="brand-feature-dot"></span>
                        设备变更全程追踪
                    </div>
                    <div class="brand-feature-item">
                        <span class="brand-feature-dot"></span>
                        数据看板实时分析
                    </div>
                </div>
            </div>
        </div>

        <!-- 右侧登录表单区 -->
        <div class="login-form-side">
            <div class="login-container">
                <div class="login-greeting">
                    <h1>欢迎回来</h1>
                    <p>请登录您的账户以继续</p>
                </div>

                {% if error %}
                <div class="error-message" role="alert">{{ error }}</div>
                {% endif %}

                <form action="/login" method="POST">
                    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

                    <div class="form-group">
                        <label for="username">用户名</label>
                        <div class="input-wrapper">
                            <svg class="input-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path>
                                <circle cx="12" cy="7" r="4"></circle>
                            </svg>
                            <input type="text" id="username" name="username" required placeholder="请输入用户名" autocomplete="username">
                        </div>
                    </div>

                    <div class="form-group">
                        <label for="password">密码</label>
                        <div class="input-wrapper">
                            <svg class="input-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
                                <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
                            </svg>
                            <input type="password" id="password" name="password" required placeholder="请输入密码" autocomplete="current-password">
                        </div>
                    </div>

                    <div class="form-options">
                        <div class="remember-me">
                            <input type="checkbox" id="remember" name="remember">
                            <label for="remember">记住用户名</label>
                        </div>
                    </div>

                    <button type="submit" class="login-btn">登 录</button>
                </form>

                <div class="login-footer">Asset Management System v2.0</div>
            </div>
        </div>
    </div>

    <script src="/static/js/login.js"></script>
</body>
</html>
