[project]
name = "zcsystem"
version = "0.1.0"
description = "资产管理系统"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "flask>=3.1.3",
    "mysql-connector-python>=9.6.0",
    "openpyxl>=3.1.5",
    "boto3>=1.42.89",
    "python-dotenv>=1.2.2",
    "gunicorn>=25.3.0",
    "bcrypt>=5.0.0",
    "flask-wtf>=1.3.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.14.0",
]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = [
    "E",   # pycodestyle error
    "W",   # pycodestyle warning
    "F",   # pyflakes
    "I",   # import 排序
    "B",   # bugbear 常见坑
    "UP",  # pyupgrade
]
ignore = [
    "E501",  # 行宽由 formatter 管，SQL 长字符串不强制折行
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
