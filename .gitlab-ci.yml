# CI：lint + 单元测试 + 密钥扫描。
# 此前是 GitLab Auto-DevOps 默认模板（17 个 stage：canary/dast/performance…），
# 与本项目实际的「gunicorn 裸机部署」完全不匹配，精简为可跑的最小流水线。
# 部署仍走服务器上的 gunicorn（见 README），不在 CI 内自动发布。

stages:
  - test

default:
  image: python:3.14

variables:
  SECRET_DETECTION_ENABLED: 'true'

lint:
  stage: test
  script:
    - pip install --quiet ruff
    - ruff check .

test:
  stage: test
  script:
    # 测试导入 app 包（需要 flask / mysql-connector / bcrypt / openpyxl 等），装全量依赖；不连数据库
    - pip install --quiet -r requirements.txt pytest
    - pytest tests/ -v

include:
  - template: Security/Secret-Detection.gitlab-ci.yml
